
# The Choice - Azure Pipelines CI

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

# Temporary PostgreSQL database for automated testing.
resources:
  containers:
    - container: postgres
      image: postgres:16
      env:
        POSTGRES_DB: the_choice
        POSTGRES_USER: the_choice_app
        POSTGRES_PASSWORD: pipeline-test-password
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U the_choice_app -d the_choice"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

# Test-only application configuration.
variables:
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  DB_NAME: the_choice
  DB_USER: the_choice_app
  DB_PASSWORD: pipeline-test-password
  FLASK_SECRET_KEY: ci-only-test-key-not-for-production

jobs:
  - job: Test
    displayName: Run application tests

    services:
      postgres: postgres

    steps:
      - checkout: self

      # Select Python 3.12.
      - task: UsePythonVersion@0
        displayName: Use Python 3.12
        inputs:
          versionSpec: '3.12'

      # Install project dependencies.
      - script: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
        displayName: Install Python dependencies

      # Install PostgreSQL client and initialize database schema.
      - script: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f db/schema.sql
        displayName: Initialize PostgreSQL schema

      # Populate database with initial test data.
      - script: |
          python db/seed.py
        displayName: Seed test database
        env:
          PGHOST: $(DB_HOST)
          PGPORT: $(DB_PORT)
          PGDATABASE: $(DB_NAME)
          PGUSER: $(DB_USER)
          PGPASSWORD: $(DB_PASSWORD)

      # Run the complete test suite.
      - script: |
          python -m pytest -q
        displayName: Run pytest

  - job: BuildAndPush
    displayName: Build and push application image
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: Build and push image to ACR
        inputs:
          azureSubscription: 'the-choice-azure'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            ACR_NAME="thechoice05e289c7"
            IMAGE="${ACR_NAME}.azurecr.io/the-choice:$(Build.BuildId)"

            echo "Checking Docker engine..."
            docker info

            echo "Authenticating to ACR..."
            az acr login --name "$ACR_NAME"

            echo "Building image: $IMAGE"
            docker build --pull --file Dockerfile --tag "$IMAGE" .

            echo "Pushing image: $IMAGE"
            docker push "$IMAGE"
