apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: the-choice

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: postgres

  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP